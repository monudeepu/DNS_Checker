name: Agora Gulf Connectivity Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native networking tools via apt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils traceroute mtr-tiny nmap netcat-openbsd curl openssl

      - name: Install Globalping CLI via apt (NEVER npm)
        run: |
          curl -s https://packagecloud.io/install/repositories/jsdelivr/globalping/script.deb.sh | sudo bash
          sudo apt-get install -y globalping
          globalping version

      - name: Make script executable
        run: chmod +x scripts/check.sh

      - name: Run the script
        run: bash scripts/check.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agora-gulf-connectivity-report
          path: report.md
          retention-days: 30