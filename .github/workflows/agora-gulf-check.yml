name: Agora Gulf Connectivity Check

on:
  workflow_dispatch:

jobs:
  connectivity-check:
    name: Run full diagnostic from Gulf regions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system networking tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            dnsutils \
            traceroute \
            mtr-tiny \
            nmap \
            netcat-openbsd \
            curl \
            openssl

      - name: Install Globalping CLI (correct method — apt, not npm)
        run: |
          curl -s https://packagecloud.io/install/repositories/jsdelivr/globalping/script.deb.sh | sudo bash
          sudo apt-get install -y globalping
          globalping version

      - name: Make script executable
        run: chmod +x scripts/check.sh

      - name: Run connectivity checks
        run: bash scripts/check.sh

      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agora-gulf-connectivity-report
          path: report.md
          retention-days: 30